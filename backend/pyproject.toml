[project]
name = "yotube"
version = "0.1.0"
description = "Turn YouTube Music playlists into Yoto MYO playlists"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "ytmusicapi>=1.9",
  "yt-dlp[default]>=2025.10.22",
  "apscheduler>=3.10,<4",
  "anthropic>=1.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/icons/synonyms.py" = ["RUF001", "RUF002", "RUF003"]
"app/icons/matcher.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []

[[tool.mypy.overrides]]
module = ["app.sync.*", "app.yoto.*"]
strict = true
